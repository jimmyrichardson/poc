<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Proof of Concept</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="./dist/assets/main.css">
</head>

<body>
  <div class="scroll-progress" role="progressbar" aria-label="Page scroll progress" aria-valuemin="0"
    aria-valuemax="100" aria-valuenow="0">
    <div class="scroll-progress__bar"></div>
  </div>

  <section class="hero">
    <h1 class="hero__left">
      <em>Expert-backed</em>
      supply chain planning
    </h1>

    <a class="scroll-cue" href="#arrow">
      <span class="scroll-cue__label">Scroll</span>
      <svg class="scroll-cue__chevron" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <path d="M2 2L12 12L22 2" stroke="currentColor" stroke-width="3" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </a>
  </section>

  <section class="arrow" id="arrow">
    <!--
      Fixed-ratio stage: every layer is positioned in percentages of this box, so
      the overlaps hold at any viewport. See components/arrow.css.
    -->
    <div class="arrow__stage">
      <!--
      #fill = clip silhouette. Brushes are stroked along #trace and clipped to #fill,
      so tips always match the silhouette (no end slivers).
    -->
      <img class="arrow-1" src="./public/arrow-1.png" />
    <svg class="draw" width="474" height="567" viewBox="0 -55 474 562" fill="none" xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true">
      <defs>
        <clipPath id="fill-clip" clipPathUnits="userSpaceOnUse">
          <path id="fill"

      </defs>

        <path id="trace-head"
          d="M372.5 502C372.5 502 438.874 454.089 460.781 406.737C482.687 359.384 434.899 360.491 378.16 391.317C321.42 422.142 359.242 377.003 383.136 335.155C407.03 293.306 379.16 275.703 347.302 290.016C315.443 304.33 258.703 359.384 198.975 415.546C139.247 471.708 15.8016 492.617 7.83691 302.131C-0.141883 111.661 136.245 -48 136.245 -48"
          fill="none" stroke="#74F183" stroke-width="58" stroke-linecap="butt" stroke-linejoin="round" />
        <!-- Tip plug only — arrowhead is covered by #trace-head without an extra cap -->
        <circle id="cap-tip" fill="#74F183" r="0" />
      </g>
    </svg>
    <!--
      Same image as above, stacked over .draw and clipped to its right half. The
      path crosses arrow-1 twice: first on the left (passes under the copy below),
      then on the right (passes under this copy — i.e. the image sits on top).
    -->
      <img class="arrow-1 arrow-1--over" src="./public/arrow-1.png" />
      <img class="arrow-2" src="./public/arrow-2.png" />
    </div>
  </section>
  <section>
    <!--
      #knockout-photo is clipped to the same path that paints the gradient, so the
      photo only ever shows inside the silhouette. It is oversized and offset by
      PHOTO_PAD on every side so the scroll-in translate never exposes an edge.
    -->
    <div class="knockout__section"> <svg id="knockout" width="381" height="512" viewBox="0 0 381 512" fill="none"
        xmlns="http://www.w3.org/2000/svg">
        <!--
        Solid var(--color-purple) base; #knockout-shade paints #2A2462 over it via the gradient.
        Photo is clipped to the same silhouette and stacked on top.
      -->
        <path id="knockout-shape"
          d="M358.399 258.003C370.694 258.003 380.66 267.969 380.66 280.264V489.516C380.66 501.81 370.694 511.776 358.399 511.776H22.2607C9.96646 511.776 5.17796e-05 501.81 0 489.516V280.264C6.72516e-05 267.969 9.96648 258.003 22.2607 258.003H21.1475V253.773H22.2607C9.96646 253.773 5.17796e-05 243.807 0 231.513V22.2607C6.72516e-05 9.96648 9.96648 3.70077e-05 22.2607 0H358.399C370.694 6.26551e-05 380.66 9.9665 380.66 22.2607V231.513C380.66 243.807 370.694 253.773 358.399 253.773H359.512V258.003H358.399Z"
          fill="var(--color-purple)" />
        <path id="knockout-shade"
          d="M358.399 258.003C370.694 258.003 380.66 267.969 380.66 280.264V489.516C380.66 501.81 370.694 511.776 358.399 511.776H22.2607C9.96646 511.776 5.17796e-05 501.81 0 489.516V280.264C6.72516e-05 267.969 9.96648 258.003 22.2607 258.003H21.1475V253.773H22.2607C9.96646 253.773 5.17796e-05 243.807 0 231.513V22.2607C6.72516e-05 9.96648 9.96648 3.70077e-05 22.2607 0H358.399C370.694 6.26551e-05 380.66 9.9665 380.66 22.2607V231.513C380.66 243.807 370.694 253.773 358.399 253.773H359.512V258.003H358.399Z"
          fill="url(#paint0_linear_603_30)" />
        <g clip-path="url(#knockout-clip)">
          <image id="knockout-photo" href="./public/photo.png" x="0" y="40" width="401" height="532"
            preserveAspectRatio="xMidYMid slice" />
        </g>
        <defs>
          <linearGradient id="paint0_linear_603_30" x1="190.33" y1="0" x2="190.33" y2="511.776"
            gradientUnits="userSpaceOnUse">
            <stop offset="0.30469" stop-color="#2A2462" stop-opacity="0" />
            <stop id="knockout-dark-stop" offset="1" stop-color="#2A2462" />
          </linearGradient>
          <clipPath id="knockout-clip" clipPathUnits="userSpaceOnUse">
            <use href="#knockout-shape" />
          </clipPath>
        </defs>
      </svg>
      <div class="convo">
        <span class="blurb blurb--received blurb--typing" id="convo-typing" aria-hidden="true">
          <i class="blurb__dot"></i>
          <i class="blurb__dot"></i>
          <i class="blurb__dot"></i>
        </span>
        <span class="blurb blurb--received" id="convo-received">Thanks for your help!</span>
        <span class="blurb blurb--sent" id="convo-sent">Anytime!</span>
      </div>
    </div>
  </section>

  <script type="module" src="./dist/assets/main.js"></script>
</body>


</html>
